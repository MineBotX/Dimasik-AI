name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assistant/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onedir --console --name Dimasik --collect-all vosk --collect-all sounddevice --collect-all pyttsx3 --collect-all comtypes --collect-all win32com assistant/main.py

      - name: Prepare portable folder
        shell: pwsh
        run: |
          Copy-Item config.json dist/Dimasik/config.json -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist/Dimasik/models | Out-Null
          @"
          Dimasik portable build.
          First-time setup still requires the Vosk Russian model and Ollama with qwen2.5:3b.
          Run the normal Install_Dimasik.bat for automatic dependency and model installation.
          "@ | Set-Content dist/Dimasik/README-FIRST.txt -Encoding utf8

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: Dimasik-Windows-x64
          path: dist/Dimasik/
          if-no-files-found: error
          retention-days: 14
