name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assistant/**"
      - "tests/**"
      - "training_data.txt"
      - "train_brain.py"
      - "requirements.txt"
      - "requirements-build.txt"
      - "update.ps1"
      - "install-runtime.ps1"
      - "Install-Dimasik.bat"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
      - name: Run DimaCore regression tests
        run: python -m unittest discover -s tests -v
      - name: Download Vosk Russian model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" -OutFile "$env:TEMP\vosk-model.zip"
          Expand-Archive -LiteralPath "$env:TEMP\vosk-model.zip" -DestinationPath models -Force
          if (!(Test-Path "models/vosk-model-small-ru-0.22/conf/model.conf")) { throw "Vosk model download failed" }
      - name: Download llama.cpp CPU runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force tools/llama | Out-Null
          $runtimeZip = "$env:TEMP/llama-cpu.zip"
          Invoke-WebRequest "https://github.com/ggml-org/llama.cpp/releases/download/b12328/llama-b12328-bin-win-cpu-x64.zip" -OutFile $runtimeZip
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath tools/llama -Force
          if (!(Get-ChildItem tools/llama -Filter llama-server.exe -Recurse)) { throw "llama-server.exe was not found in the CPU runtime archive" }
      - name: Download stable-diffusion.cpp Vulkan runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force tools/stable-diffusion | Out-Null
          $runtimeZip = "$env:TEMP/stable-diffusion-vulkan.zip"
          Invoke-WebRequest "https://github.com/leejet/stable-diffusion.cpp/releases/download/master-1106-532d2c1/sd-master-532d2c1-bin-win-vulkan-x64.zip" -OutFile $runtimeZip
          $actualHash = (Get-FileHash -LiteralPath $runtimeZip -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne "3e66222c87ca27074e1fd8ce79706eef17a8aaf39949906aa1bee7e060f22ecc") { throw "stable-diffusion.cpp runtime SHA-256 mismatch" }
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath tools/stable-diffusion -Force
          if (!(Get-ChildItem tools/stable-diffusion -Filter sd-cli.exe -Recurse)) { throw "sd-cli.exe was not found in the Vulkan runtime archive" }
      - name: Train Dimasik neural core
        run: python train_brain.py
      - name: Build GUI executable
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name Dimasik --collect-all vosk --collect-all sounddevice --collect-all pyttsx3 --collect-all keyring --hidden-import keyring.backends.Windows --collect-all comtypes --collect-all win32com assistant/main.py
      - name: Prepare installer package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "package"
          New-Item -ItemType Directory -Force $package | Out-Null
          Set-Content dist/Dimasik/VERSION $env:GITHUB_SHA -Encoding ascii
          Copy-Item update.ps1 dist/Dimasik/update.ps1
          Copy-Item models/vosk-model-small-ru-0.22 dist/Dimasik/models/vosk-model-small-ru-0.22 -Recurse -Force
          Copy-Item brain dist/Dimasik/brain -Recurse -Force
          New-Item -ItemType Directory -Force dist/Dimasik/tools | Out-Null
          Copy-Item tools/llama dist/Dimasik/tools/llama -Recurse -Force
          Copy-Item tools/stable-diffusion dist/Dimasik/tools/stable-diffusion -Recurse -Force
          Copy-Item dist/Dimasik (Join-Path $package "Dimasik") -Recurse -Force
          Copy-Item install-runtime.ps1 $package
          Copy-Item Install-Dimasik.bat $package
          Compress-Archive -Path "$package/*" -DestinationPath Dimasik-Windows-GUI-x64.zip -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dimasik-Windows-GUI-x64
          path: Dimasik-Windows-GUI-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish rolling update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dimasik ${{ github.sha }}
          body: "Build: ${{ github.sha }}

Run Install-Dimasik.bat to install the locally trained Dimasik neural assistant. No Ollama or Qwen required."
          files: Dimasik-Windows-GUI-x64.zip
          overwrite_files: true
          make_latest: true
